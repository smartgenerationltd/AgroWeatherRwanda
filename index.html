    <!-- Structured Data with Official Logo URLs -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AgroWeather Rwanda",
      "alternateName": "Iteganyagihe ry'Ubuhinzi Rwanda",

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes pulse-gentle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.03); }
      }
      .logo-loading-pulse {
        animation: pulse-gentle 2s ease-in-out infinite;
      }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.1.1/",
        "react": "https://aistudiocdn.com/react@^19.1.1",
        "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-slate-950 text-white min-h-screen">
    <div id="root">
      <!-- High-fidelity HTML Logo Splash while bundle loads -->
      <div id="initial-loading-splash" class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-sky-950 via-slate-900 to-slate-950 text-center">
        <!-- SVG Brand Symbol of AgroWeather Rwanda -->
        <div class="logo-loading-pulse mb-6 relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="80" height="80" class="rounded-3xl shadow-2xl shadow-emerald-500/20 ring-2 ring-white/20">
            <defs>
              <linearGradient id="initRwandaSky" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="50%" stop-color="#0369a1" />
                <stop offset="100%" stop-color="#064e3b" />
              </linearGradient>
              <radialGradient id="initRwandaSun" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fef08a" />
                <stop offset="60%" stop-color="#f59e0b" />
                <stop offset="100%" stop-color="#d97706" />
              </radialGradient>
              <linearGradient id="initAgroLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#059669" />
                <stop offset="50%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#6ee7b7" />
              </linearGradient>
              <linearGradient id="initRwandaHills" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#064e3b" />
              </linearGradient>
              <linearGradient id="initRainDrop" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="18" fill="url(#initRwandaSky)" />
            <!-- Golden Sun with Rays -->
            <g transform="translate(42, 18)">
              <circle cx="0" cy="0" r="11" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="2, 2.5" opacity="0.8" />
              <circle cx="0" cy="0" r="7.5" fill="url(#initRwandaSun)" />
            </g>
            <!-- Cloud -->
            <path d="M16 28 C16 24 19 21 23 21 C24.5 18 28 16 32 17 C35.5 18 38 21 38.5 24 C41.5 24 44 26.5 44 29.5 C44 32.5 41.5 35 38.5 35 L19.5 35 C17.5 35 16 33.5 16 31.5 Z" fill="#ffffff" />
            <!-- Rain Drops -->
            <path d="M21 38 L19.5 42 A1.2 1.2 0 0 0 21.8 42.8 L22.5 38 Z" fill="url(#initRainDrop)" />
            <path d="M28 38 L26.5 43 A1.2 1.2 0 0 0 28.8 43.8 L29.5 38 Z" fill="url(#initRainDrop)" />
            <path d="M35 38 L33.5 42 A1.2 1.2 0 0 0 35.8 42.8 L36.5 38 Z" fill="url(#initRainDrop)" />
            <!-- Hills -->
            <path d="M0 48 Q18 38 36 46 T64 42 L64 64 L0 64 Z" fill="url(#initRwandaHills)" opacity="0.95" />
            <path d="M0 54 Q24 45 48 52 T64 50 L64 64 L0 64 Z" fill="#042f2e" />
            <!-- Crop Sprout -->
            <g transform="translate(32, 49)">
              <path d="M0 6 Q1 0 0 -14" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" fill="none" />
              <path d="M0 -6 C5 -13 14 -12 14 -3 C14 3 6 4 0 -4 Z" fill="url(#initAgroLeaf)" />
              <path d="M0 -1 C-4 -6 -11 -5 -11 1 C-11 5 -4 6 0 0 Z" fill="url(#initAgroLeaf)" />
              <circle cx="9" cy="-5" r="1" fill="#ffffff" opacity="0.9" />
            </g>
          </svg>
          <div class="absolute -bottom-1 -right-1 bg-slate-900 border border-white/40 rounded-full px-1.5 py-0.5 text-[10px] select-none">
            🇷🇼
          </div>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white mb-2">
          AgroWeather <span class="text-sky-400">Rwanda</span>
        </h1>
        <p class="text-xs sm:text-sm text-slate-300 font-medium max-w-sm mb-4">
          Iteganyagihe ry'Ubuhinzi • Meteo Rwanda & RAB
        </p>
        <div class="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-300 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-400/30">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span>Guhuza amakuru y'iteganyagihe...</span>
        </div>
      </div>
